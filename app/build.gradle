plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ali.glovebox'
    compileSdk 34

    defaultConfig {
        applicationId "com.ali.glovebox"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
